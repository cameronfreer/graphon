name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build project and blueprint
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7

      # docbuild/ compiles the project's own sources against its own resolved Mathlib; if that
      # drifts from the root's, the site build fails while ordinary CI stays green.
      - name: Check docbuild sync (toolchain and Mathlib match the root)
        run: python3 scripts/check_docbuild_sync.py

      # doc-gen4's incremental state lives in docbuild/.lake, a separate Lake workspace from the
      # root .lake that lean-action caches, so without this it was regenerated from scratch on
      # every master push. Restore it here, before lean-action saves this run's large root
      # cache, so the small docs entry is retrieved and its last-access refreshed before more
      # storage pressure is added (eviction is by last access); save immediately after successful
      # generation, so a later TeX, Jekyll, or Pages failure cannot discard a valid cache. The
      # build command stays unconditional: the cache supplies prior state, Lake decides freshness.
      # Key: format version, OS, arch, both toolchains, both manifests, both Lake configurations,
      # and the exact commit; the fallback drops only the commit, restoring the latest compatible
      # prior state. Bump docbuild-v1 if the cached path or doc-gen4 layout changes.
      # API generation runs on master pushes and on manual dispatch (so the cache can be
      # exercised from a branch); assembly and deployment stay master-only below.
      - name: Restore docbuild cache
        if: (github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
        id: docbuild-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: docbuild/.lake/build
          key: docbuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'docbuild/lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json', 'lakefile.toml', 'docbuild/lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            docbuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'docbuild/lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json', 'lakefile.toml', 'docbuild/lakefile.toml') }}-


      - name: Build Lean project and blueprint
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e
        with:
          build: true
          build-args: ":blueprint :blueprintJson"
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build the deliberately non-root Spectral module
        run: lake build Graphon.Spectral

      - name: Check frozen-stub census and headline axiom audit
        run: bash scripts/check_census_and_axioms.sh

      - name: Check documentation drift (canonical URL, links, inventories)
        run: python3 scripts/check_site_links.py

      - name: Install blueprint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev texlive-latex-extra texlive-xetex texlive-fonts-recommended texlive-fonts-extra latexmk
          pip install leanblueprint

      - name: Generate bibliography for web
        run: |
          cd blueprint/src
          pdflatex -interaction=nonstopmode print.tex || true
          bibtex print
          cp print.bbl web.bbl

      - name: Build blueprint website
        run: leanblueprint web

      - name: Check blueprint declarations
        run: lake exe checkdecls blueprint/lean_decls

      - name: Build blueprint PDF
        run: leanblueprint pdf

      - name: Build API docs
        if: (github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
        run: |
          cd docbuild
          lake build Graphon:docs

      - name: Save docbuild cache
        if: ((github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch') && steps.docbuild-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docbuild/.lake/build
          key: ${{ steps.docbuild-cache-restore.outputs.cache-primary-key }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: home_page

      # Built on every trigger so that PRs validate the Liquid syntax and the site
      # configuration; only assembly, upload, and deployment remain master-only.
      - name: Build homepage
        run: |
          cd home_page
          bundle exec jekyll build --destination ../_site

      - name: Smoke-test the built homepage
        run: python3 scripts/check_built_site.py

      - name: Assemble site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site/blueprint
          cp -r blueprint/web/* _site/blueprint/
          cp blueprint/print/print.pdf _site/blueprint/blueprint.pdf
          if [ -d docbuild/.lake/build/doc ]; then cp -r docbuild/.lake/build/doc _site/docs; fi

      - name: Smoke-test the assembled site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: python3 scripts/check_built_site.py --assembled

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
